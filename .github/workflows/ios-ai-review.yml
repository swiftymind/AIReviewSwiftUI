\outl0\strokewidth0 \strokec2 name: iOS AI Code Review\
on:\
  pull_request:\
    types: [opened, synchronize]\
    branches: [main, develop, release/*]\
\
jobs:\
  ios-ai-review:\
    runs-on: macos-latest\
    permissions:\
      contents: read\
      pull-requests: write\
    \
    steps:\
      - name: Checkout code\
        uses: actions/checkout@v4\
        with:\
          fetch-depth: 0\
      \
      - name: Setup Xcode\
        uses: maxim-lobanov/setup-xcode@v1\
        with:\
          xcode-version: latest-stable\
      \
      - name: Get changed iOS files\
        id: changed-files\
        uses: tj-actions/changed-files@v40\
        with:\
          files: |\
            **/*.swift\
            **/*.m\
            **/*.h\
            **/*.storyboard\
            **/*.xib\
            **/*.xcconfig\
            **/*.plist\
            **/Podfile\
            **/Package.swift\
      \
      - name: Setup Node.js\
        uses: actions/setup-node@v4\
        with:\
          node-version: '18'\
      \
      - name: Install dependencies\
        run: npm install axios\
      \
      - name: Run iOS AI Review\
        env:\
          OPENAI_API_KEY: $\{\{ secrets.OPENAI_API_KEY \}\}\
          ANTHROPIC_API_KEY: $\{\{ secrets.ANTHROPIC_API_KEY \}\}\
          GITHUB_TOKEN: $\{\{ secrets.GITHUB_TOKEN \}\}\
          PR_NUMBER: $\{\{ github.event.number \}\}\
        run: node scripts/ios-ai-reviewer.js "$\{\{ steps.changed-files.outputs.all_changed_files \}\}"\
      \
      - name: Swift Lint Check\
        run: |\
          if command -v swiftlint >/dev/null 2>&1; then\
            swiftlint --reporter github-actions-logging\
          else\
            echo "SwiftLint not installed, skipping..."\
          fi}