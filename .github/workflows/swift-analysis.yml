name: Swift Code Analysis

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  swift-analysis:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build project
        run: |
          xcodebuild -scheme ${{ secrets.IOS_SCHEME_NAME }} -destination 'platform=iOS Simulator,name=iPhone 15' build-for-testing
        continue-on-error: true

      - name: Run Tests
        run: |
          xcodebuild test -scheme ${{ secrets.IOS_SCHEME_NAME }} -destination 'platform=iOS Simulator,name=iPhone 15'
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          pip install requests openai

      - name: Analyze Swift Code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          OPENAI_MODEL: gpt-4o
        run: python scripts/swift-analyzer.py